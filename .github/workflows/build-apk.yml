name: Build MCH Care APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Offline-First Auto-Update Web Files
        run: |
          mkdir -p www
          cp index.html www/app-bundle.html
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="my">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>MCH Care</title>
            <style>
              body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#f0fdfa;font-family:sans-serif;color:#0f766e;text-align:center;}
            </style>
          </head>
          <body>
            <div>
              <div style="font-size:34px;margin-bottom:8px;">🏥</div>
              <div style="font-weight:700;font-size:15px;">MCH Care ဖွင့်နေပါသည်...</div>
            </div>
            <script>
              (function(){
                var BUILD_ID = "__BUILD_ID__";
                function hashStr(s){
                  var clean = String(s||"").replace(/\r\n/g,"\n").trim();
                  var h = 5381;
                  for(var i=0;i<clean.length;i++){h=((h<<5)+h)+clean.charCodeAt(i);h=h&h;}
                  return clean.length + "_" + h;
                }
                function boot(html){
                  try{sessionStorage.setItem("mch_loaded_hash", hashStr(html));}catch(e){}
                  document.open();
                  document.write(html);
                  document.close();
                }
                try{
                  if(localStorage.getItem("mch_apk_build") !== BUILD_ID){
                    localStorage.removeItem("mch_ota_html");
                    localStorage.setItem("mch_apk_build", BUILD_ID);
                  }
                }catch(e){}
                var cached = "";
                try{cached = localStorage.getItem("mch_ota_html") || "";}catch(e){}
                if(cached && cached.length > 2000 && cached.indexOf("</html>") !== -1){
                  boot(cached);
                } else {
                  fetch("./app-bundle.html")
                    .then(function(r){return r.text();})
                    .then(function(html){boot(html);})
                    .catch(function(){
                      document.body.innerHTML = '<div style="padding:20px;">အက်ပ်ဖွင့်ရာတွင် အမှားဖြစ်ပေါ်နေပါသည်။ ပြန်ဖွင့်ပေးပါ။</div>';
                    });
                }
              })();
            </script>
          </body>
          </html>
          EOF
          sed -i "s/__BUILD_ID__/${{ github.run_number }}/g" www/index.html

      - name: Install Capacitor & create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "MCH Care" "com.mchcare.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply Custom App Icon
        run: |
          ICON_FILE=$(find . -maxdepth 1 -type f \( -iname "icon.png" -o -iname "icon.jpg" -o -iname "icon.jpeg" -o -iname "icon.webp" \) | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            echo "Found custom icon: $ICON_FILE"
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            rm -f android/app/src/main/res/mipmap-*/ic_launcher_foreground.png
            convert "$ICON_FILE" -auto-orient -resize 512x512^ -gravity center -extent 512x512 icon_square.png
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              DENSITY="${pair%%:*}"
              SIZE="${pair##*:}"
              mkdir -p "android/app/src/main/res/mipmap-${DENSITY}"
              convert icon_square.png -resize "${SIZE}x${SIZE}" "android/app/src/main/res/mipmap-${DENSITY}/ic_launcher.png"
              convert icon_square.png -resize "${SIZE}x${SIZE}" "android/app/src/main/res/mipmap-${DENSITY}/ic_launcher_round.png"
            done
          else
            echo "No custom icon file found, using default icon."
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCH-Care-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

